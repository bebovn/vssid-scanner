<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quét Tự Động QR CCCD</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --pri: #0d47a1; --pri-l: #42a5f5; --pri-bg: #e3f2fd;
      --ok: #2e7d32; --ok-bg: #e8f5e9;
      --err: #c62828; --err-bg: #ffebee;
      --bg: #f4f6f9; --card: #ffffff;
      --txt: #1a1a2e; --txt2: #5f6368; --txt3: #9aa0a6;
      --bdr: #e0e3e8; --bdr2: #c4c9d0;
      --r: 12px; --rs: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
      --zoom: 1.8;
    }
    body { background: var(--bg); padding: 12px; display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: var(--txt); }
    
    .card {
      background: var(--card); width: 100%; max-width: 480px;
      border-radius: var(--r); padding: 16px;
      box-shadow: var(--shadow-md);
      transition: box-shadow .35s cubic-bezier(.4,0,.2,1);
    }
    .card:hover { box-shadow: var(--shadow-lg); }
    h2 {
      font-size: 15px; color: var(--pri); text-align: center;
      margin-bottom: 12px; font-weight: 700; letter-spacing: -.2px;
    }

    /* ─── Scanner — kiểu Zalo: toàn màn hình, chỉ 1 đường scan ─── */
    .scanner-wrap {
      position: relative; width: 100%; height: 220px;
      background: #0a0a0a; border-radius: var(--r);
      overflow: hidden; margin-bottom: 12px;
      box-shadow: inset 0 0 40px rgba(0,0,0,.4);
    }
    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(var(--zoom));
      transform-origin: center center;
      animation: camZoomIn .5s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    @keyframes camZoomIn {
      0% { transform: scale(1); opacity: .6; }
      100% { transform: scale(var(--zoom)); opacity: 1; }
    }

    /* Đường scan — chạy ngang toàn chiều, kiểu Zalo */
    .scan-line {
      position: absolute; left: 0; right: 0;
      height: 2px; top: 50%;
      background: var(--pri-l);
      box-shadow: 0 0 6px var(--pri-l), 0 0 20px rgba(66,165,245,.2);
      animation: scanY 2.4s cubic-bezier(.42,0,.58,1) infinite;
      z-index: 3;
    }
    @keyframes scanY { 0%,100% { transform: translateY(-110px); } 50% { transform: translateY(110px); } }

    /* Khung 4 góc — Ẩn mặc định, chỉ hiện khi loading */
    .scan-guide {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: calc(140px * var(--zoom) / 1.2);
      height: calc(140px * var(--zoom) / 1.2);
      border: 1.5px solid rgba(66,165,245,.25);
      border-radius: 14px;
      pointer-events: none;
      z-index: 2;
    }
    /* Loading: hiện khung nhạt nhấp nháy */
    .scan-guide.loading {
      display: block;
      animation: guideBlink 1.2s ease-in-out infinite;
    }
    @keyframes guideBlink {
      0%,100% { border-color: rgba(66,165,245,.15); }
      50% { border-color: rgba(66,165,245,.45); }
    }

    /* Gợi ý di chuyển */
    .move-hint {
      position: absolute; z-index: 6; pointer-events: none;
      font-size: 26px; color: rgba(255,255,255,.8);
      text-shadow: 0 2px 8px rgba(0,0,0,.6);
      display: none;
    }
    .move-hint.up    { top: 14px; left: 50%; transform: translateX(-50%); animation: hintY 1s ease-in-out infinite alternate; }
    .move-hint.down  { bottom: 50px; left: 50%; transform: translateX(-50%); animation: hintY 1s ease-in-out infinite alternate-reverse; }
    .move-hint.left  { left: 14px; top: 50%; transform: translateY(-50%); animation: hintX 1s ease-in-out infinite alternate; }
    .move-hint.right { right: 14px; top: 50%; transform: translateY(-50%); animation: hintX 1s ease-in-out infinite alternate-reverse; }
    @keyframes hintY { 0% { opacity: .4; transform: translateX(-50%) translateY(0); } 100% { opacity: .9; transform: translateX(-50%) translateY(-6px); } }
    @keyframes hintX { 0% { opacity: .4; transform: translateY(-50%) translateX(0); } 100% { opacity: .9; transform: translateY(-50%) translateX(-6px); } }

    /* Flash khi nhận diện thành công */
    .scan-flash {
      position: absolute; inset: 0; z-index: 4;
      background: rgba(76,175,80,.25);
      pointer-events: none;
      opacity: 0;
    }
    .scan-flash.active {
      animation: flashBang .4s ease-out;
    }
    @keyframes flashBang {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }

    .cam-status {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 11px; font-weight: 500;
      background: rgba(0,0,0,.55); padding: 4px 14px;
      border-radius: 20px; backdrop-filter: blur(6px);
      white-space: nowrap; z-index: 5;
      transition: background .3s;
    }
    .cam-status.pulse { animation: statusPulse 1.5s ease infinite; }
    @keyframes statusPulse {
      0%,100% { background: rgba(0,0,0,.55); }
      50% { background: rgba(66,165,245,.25); }
    }

    .cam-closed-box {
      display: none; position: absolute; inset: 0;
      background: rgba(10,10,10,.88); backdrop-filter: blur(8px);
      flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      z-index: 5;
      animation: fadeOverlay .35s ease;
    }
    @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
    .cam-closed-box .done-icon { font-size: 44px; animation: popIn .4s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .cam-closed-box .done-text { color: #fff; font-size: 13px; font-weight: 600; animation: fadeUp .4s ease .1s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .btn-reopen {
      background: var(--pri); color: #fff; border: none;
      padding: 10px 24px; border-radius: 24px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(13,71,161,.35);
      transition: transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s;
      position: relative; overflow: hidden;
      animation: fadeUp .4s ease .2s both;
    }
    .btn-reopen::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.15) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform .5s;
    }
    .btn-reopen:hover::after { transform: translateX(100%); }
    .btn-reopen:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 20px rgba(13,71,161,.4); }
    .btn-reopen:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(13,71,161,.3); transition-duration: .08s; }

    /* ─── Form ─── */
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--txt2); margin-bottom: 3px; transition: color .2s; }
    .form-group:focus-within label { color: var(--pri); }
    input, select {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--bdr); border-radius: var(--rs);
      font-size: 14px; color: var(--txt); background: #fff;
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }
    input:focus, select:focus {
      border-color: var(--pri-l);
      box-shadow: 0 0 0 3px rgba(66,165,245,.1), 0 1px 4px rgba(66,165,245,.08);
    }
    input::placeholder { color: var(--txt3); transition: color .2s; }
    input:focus::placeholder { color: var(--pri-l); opacity: .5; }
    input.locked {
      background: var(--pri-bg) !important; color: var(--pri) !important;
      border-color: #90caf9 !important; font-weight: 600; cursor: default;
      box-shadow: none !important;
    }
    input.locked:focus { box-shadow: none !important; }
    select { cursor: pointer; transition: border-color .25s, box-shadow .25s; }
    select:hover { border-color: var(--bdr2); }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    .hint { font-size: 11px; margin-top: 2px; color: var(--txt3); transition: color .25s; }

    .btn-submit {
      width: 100%; padding: 13px; background: var(--ok); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      box-shadow: 0 2px 8px rgba(46,125,50,.25);
      transition: transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s, opacity .2s, background .2s;
      position: relative; overflow: hidden;
    }
    .btn-submit::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.12) 50%, transparent 60%);
      transform: translateX(-120%);
      transition: transform .6s;
    }
    .btn-submit:hover::before { transform: translateX(120%); }
    .btn-submit:hover { box-shadow: 0 4px 16px rgba(46,125,50,.35); transform: translateY(-2px); background: #388e3c; }
    .btn-submit:active { transform: translateY(0) scale(.98); box-shadow: 0 2px 6px rgba(46,125,50,.25); transition-duration: .08s; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
    .btn-submit:disabled::before { display: none; }

    #msgBox {
      margin-top: 10px; padding: 10px 14px; border-radius: var(--rs);
      font-size: 13px; text-align: center; display: none;
      font-weight: 500; transform-origin: top center;
    }
    .msg-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #a5d6a7; animation: msgIn .3s cubic-bezier(.175,.885,.32,1.275); }
    .msg-err { background: var(--err-bg); color: var(--err); border: 1px solid #ef9a9a; animation: msgIn .3s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes msgIn { from { opacity: 0; transform: scale(.92) translateY(-8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    input.locked:focus { animation: lockPulse .5s ease; }
    @keyframes lockPulse { 0% { box-shadow: 0 0 0 0 rgba(13,71,161,0); } 50% { box-shadow: 0 0 0 4px rgba(13,71,161,.1); } 100% { box-shadow: 0 0 0 0 rgba(13,71,161,0); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Quét Tự Động QR CCCD → Sheet</h2>

    <div class="scanner-wrap" id="scannerWrap">
      <video id="video" playsinline muted autoplay></video>

      <!-- Chỉ 1 đường scan line chạy ngang — kiểu Zalo -->
      <div class="scan-line" id="scanLine"></div>

      <!-- Khung 4 góc: chỉ hiện khi đang loading, ẩn khi quét -->
      <div class="scan-guide loading" id="scanGuide">
        <div class="scan-bl"></div><div class="scan-br"></div>
      </div>

      <!-- Gợi ý di chuyển -->
      <div class="move-hint up"    id="hintUp">⬆</div>
      <div class="move-hint down"  id="hintDown">⬇</div>
      <div class="move-hint left"  id="hintLeft">⬅</div>
      <div class="move-hint right" id="hintRight">➡</div>

      <!-- Flash khi nhận diện thành công -->
      <div class="scan-flash" id="scanFlash"></div>

      <div class="cam-status" id="camStatus">Đang kết nối camera sau...</div>
      <div class="cam-closed-box" id="camClosedBox">
        <div class="done-icon">✅</div>
        <div class="done-text">Đã quét xong hồ sơ</div>
        <button type="button" class="btn-reopen" id="btnReopen">📷 Quét hồ sơ tiếp theo</button>
      </div>
    </div>

    <form id="recordForm" autocomplete="off">
      <div class="row">
        <div class="form-group">
          <label>Số CCCD *</label>
          <input type="text" id="cccd" required placeholder="084..." inputmode="numeric" pattern="\d*">
        </div>
        <div class="form-group">
          <label>Mã số BHXH *</label>
          <input type="text" id="maBhxh" required placeholder="8411..." inputmode="numeric" pattern="\d*">
          <div class="hint" id="bhxhHint">Tự động tra cứu từ Sheet</div>
        </div>
      </div>

      <div class="form-group">
        <label>Họ và tên *</label>
        <input type="text" id="hoTen" required placeholder="NGUYEN VAN A">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Tỉnh/Thành</label>
          <input type="text" id="tinhName" value="[86] Vĩnh Long" readonly class="locked">
        </div>
        <div class="form-group">
          <label>Xã/Phường *</label>
          <select id="xaCode" required>
            <option value="">-- Chọn Xã/Phường --</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Số nhà, ngõ, đường, ấp *</label>
        <input type="text" id="diaChi" required placeholder="Ấp Bến Thế...">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="0901234567" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Nhập đúng 10 chữ số">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" required placeholder="example@gmail.com" inputmode="email">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Lưu vào hàng đợi</button>
    </form>
    <div id="msgBox"></div>
  </div>

  <canvas id="qrCanvas" style="display:none;"></canvas>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5VIF-hm4iTkWIO1aOzU_XDsosCIBU1VlUuYsYUixEUJ6ifoSwEtsb1BEyM0FXfNJYkQ/exec";

    const DANH_MUC_XA = [
      {"ten": "Xã Cầu Ngang", "matinh": "86", "maphuongxa": "29416"},
      {"ten": "Xã Mỹ Long", "matinh": "86", "maphuongxa": "29419"},
      {"ten": "Xã Vinh Kim", "matinh": "86", "maphuongxa": "29431"},
      {"ten": "Xã Nhị Trường", "matinh": "86", "maphuongxa": "29446"},
      {"ten": "Xã Hiệp Mỹ", "matinh": "86", "maphuongxa": "29455"},
      {"ten": "Xã Trà Cú", "matinh": "86", "maphuongxa": "29461"},
      {"ten": "Xã Tập Sơn", "matinh": "86", "maphuongxa": "29467"},
      {"ten": "Xã Lưu Nghiệp Anh", "matinh": "86", "maphuongxa": "29476"},
      {"ten": "Xã Hàm Giang", "matinh": "86", "maphuongxa": "29489"},
      {"ten": "Xã Đại An", "matinh": "86", "maphuongxa": "29491"},
      {"ten": "Xã Long Hiệp", "matinh": "86", "maphuongxa": "29506"}
    ];

    const video = document.getElementById('video');
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const camStatus = document.getElementById('camStatus');
    const scanGuide = document.getElementById('scanGuide');
    const scanLine = document.getElementById('scanLine');
    const scanFlash = document.getElementById('scanFlash');
    const camClosedBox = document.getElementById('camClosedBox');
    const btnReopen = document.getElementById('btnReopen');
    const cccdInput = document.getElementById('cccd');
    const hoTenInput = document.getElementById('hoTen');
    const maBhxhInput = document.getElementById('maBhxh');

    let isScanning = false;
    let streamRef = null;
    let focusTimer = null;

    function loadXaList() {
      const sel = document.getElementById('xaCode');
      sel.innerHTML = '<option value="">-- Chọn Xã/Phường --</option>';
      DANH_MUC_XA.forEach(x => {
        const o = document.createElement('option');
        o.value = x.maphuongxa;
        o.textContent = x.ten + ' [' + x.maphuongxa + ']';
        sel.appendChild(o);
      });
    }
    loadXaList();

    function resetFieldLocks() {
      [cccdInput, hoTenInput, maBhxhInput].forEach(i => {
        i.readOnly = false;
        i.classList.remove('locked');
      });
      document.getElementById('bhxhHint').textContent = 'Tự động tra cứu từ Sheet';
      document.getElementById('bhxhHint').style.color = '';
    }

    async function lookupBhxh(cccd) {
      const hint = document.getElementById('bhxhHint');
      hint.textContent = 'Đang tìm mã BHXH...';
      hint.style.color = '';
      try {
        const res = await fetch(SCRIPT_URL + '?action=lookupBhxh&cccd=' + encodeURIComponent(cccd));
        const json = await res.json();
        if (json.status === 'success' && json.maBhxh) {
          maBhxhInput.value = json.maBhxh;
          maBhxhInput.readOnly = true;
          maBhxhInput.classList.add('locked');
          hint.textContent = '✅ Đã tìm thấy mã BHXH';
          hint.style.color = 'var(--ok)';
        } else {
          maBhxhInput.value = '';
          maBhxhInput.readOnly = false;
          maBhxhInput.classList.remove('locked');
          hint.textContent = '⚠️ Chưa có mã BHXH (Nhập tay)';
          hint.style.color = 'var(--err)';
        }
      } catch(e) {
        maBhxhInput.readOnly = false;
        maBhxhInput.classList.remove('locked');
        hint.textContent = 'Lỗi tìm kiếm — Nhập tay mã BHXH';
        hint.style.color = 'var(--err)';
      }
    }

    document.getElementById('cccd').addEventListener('blur', function() {
      if (this.value.trim().length >= 9) lookupBhxh(this.value.trim());
    });

    document.getElementById('phone').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    function cleanShortAddress(addr) {
      if (!addr) return '';
      const parts = addr.split(',').map(s => s.trim()).filter(Boolean);
      return parts[0] || '';
    }

    function parseQRCode(text) {
      if (!text || !text.includes('|')) return false;
      const p = text.split('|');
      if (p.length < 6) return false;

      cccdInput.value = p[0].trim();
      cccdInput.readOnly = true;
      cccdInput.classList.add('locked');

      hoTenInput.value = p[2].trim();
      hoTenInput.readOnly = true;
      hoTenInput.classList.add('locked');

      document.getElementById('diaChi').value = cleanShortAddress(p[5].trim());
      lookupBhxh(p[0].trim());

      const matched = DANH_MUC_XA.find(x =>
        p[5].trim().toLowerCase().includes(x.ten.replace(/^Xã\s+|^Phường\s+/i, '').toLowerCase())
      );
      if (matched) document.getElementById('xaCode').value = matched.maphuongxa;

      /* Flash xanh khi thành công */
      scanFlash.classList.add('active');
      setTimeout(() => scanFlash.classList.remove('active'), 500);
      hideAllHints();

      showMsg('✅ Đã nhận diện CCCD (Đã khóa trường cố định)!', 'ok');
      if (navigator.vibrate) navigator.vibrate(200);
      stopCamera();
      return true;
    }

    /* Gợi ý di chuyển khi QR ở rìa */
    function showHint(dir) {
      hideAllHints();
      var map = { up: 'Up', down: 'Down', left: 'Left', right: 'Right' };
      var el = document.getElementById('hint' + map[dir]);
      if (el) el.style.display = 'block';
    }
    function hideAllHints() {
      ['Up','Down','Left','Right'].forEach(d => {
        var el = document.getElementById('hint' + d);
        if (el) el.style.display = 'none';
      });
    }

    function scanFrame() {
      if (!isScanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

        if (code && code.location) {
          var cx = code.location.center.x / canvas.width;
          var cy = code.location.center.y / canvas.height;
          var m = 0.32;
          if (cy < m) showHint('up');
          else if (cy > 1 - m) showHint('down');
          else if (cx < m) showHint('left');
          else if (cx > 1 - m) showHint('right');
          else hideAllHints();

          if (code.data && parseQRCode(code.data)) return;
        }

        if (!code) hideAllHints();
      }
      requestAnimationFrame(scanFrame);
    }

    function stopCamera() {
      isScanning = false;
      if (focusTimer) { clearTimeout(focusTimer); focusTimer = null; }
      if (streamRef) {
        streamRef.getTracks().forEach(t => t.stop());
        streamRef = null;
      }
      video.srcObject = null;
      video.style.display = 'none';
      scanLine.style.display = 'none';
      scanGuide.style.display = 'none';
      scanFlash.classList.remove('active');
      camStatus.style.display = 'none';
      camClosedBox.style.display = 'flex';
      hideAllHints();
    }

    async function startCamera() {
      video.style.display = 'block';
      scanLine.style.display = 'block';
      scanGuide.className = 'scan-guide loading';
      scanFlash.classList.remove('active');
      camStatus.style.display = 'block';
      camClosedBox.style.display = 'none';
      camStatus.textContent = 'Đang kết nối camera sau...';
      camStatus.classList.add('pulse');
      hideAllHints();

      const chains = [
        { video: { facingMode: { exact: "environment" }, width: { ideal: 1280, min: 640 }, height: { ideal: 720, min: 480 }, advanced: [{ focusMode: "continuous" }] } },
        { video: { facingMode: { exact: "environment" }, width: { ideal: 1280, min: 640 }, height: { ideal: 720, min: 480 } } },
        { video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } },
        { video: { facingMode: "environment" } },
        { video: true }
      ];

      for (const c of chains) {
        try {
          streamRef = await navigator.mediaDevices.getUserMedia(c);
          break;
        } catch(e) {
          console.warn('Camera fallback:', e.message || e.name);
        }
      }

      if (!streamRef) {
        camStatus.classList.remove('pulse');
        camStatus.textContent = '❌ Không mở được camera — kiểm tra quyền';
        return;
      }

      try {
        video.srcObject = streamRef;
        video.setAttribute('playsinline', '');
        await video.play();
        isScanning = true;
        camStatus.classList.remove('pulse');
        camStatus.textContent = 'Hướng mặt sau CCCD vào khung quét';
        /* Ẩn khung nhấp nháy, hiện đường scan */
        setTimeout(() => { scanGuide.className = 'scan-guide'; }, 600);
        requestAnimationFrame(scanFrame);

        if (focusTimer) clearTimeout(focusTimer);
        focusTimer = setTimeout(() => {
          if (!isScanning) return;
          camStatus.textContent = 'Đang lấy nét lại...';
          camStatus.classList.add('pulse');
          stopCamera();
          setTimeout(startCamera, 400);
        }, 10000);

      } catch(e) {
        camStatus.classList.remove('pulse');
        camStatus.textContent = '❌ Lỗi phát: ' + e.message;
      }
    }

    btnReopen.addEventListener('click', startCamera);
    window.addEventListener('DOMContentLoaded', startCamera);

    document.getElementById('recordForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phoneVal = document.getElementById('phone').value.trim();
      if (!/^\d{10}$/.test(phoneVal)) {
        showMsg('❌ Số điện thoại phải đúng 10 chữ số!', 'err');
        document.getElementById('phone').focus();
        return;
      }

      const emailVal = document.getElementById('email').value.trim();
      if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        showMsg('❌ Email không đúng định dạng!', 'err');
        document.getElementById('email').focus();
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Đang lưu vào Sheet...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'addRecord',
          cccd: cccdInput.value.trim(),
          maBhxh: maBhxhInput.value.trim(),
          hoTen: hoTenInput.value.trim(),
          tinhCode: '86',
          xaCode: document.getElementById('xaCode').value,
          diaChi: document.getElementById('diaChi').value.trim(),
          phone: phoneVal,
          email: emailVal
        })
      })
      .then(r => r.json())
      .then(r => {
        btn.disabled = false;
        btn.textContent = 'Lưu vào hàng đợi';
        showMsg('🎉 Đã thêm hồ sơ vào Google Sheet thành công!', 'ok');
        document.getElementById('recordForm').reset();
        resetFieldLocks();
        startCamera();
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = 'Lưu vào hàng đợi';
        showMsg('Lỗi khi gửi: ' + err, 'err');
      });
    });

    function showMsg(t, type) {
      const b = document.getElementById('msgBox');
      b.textContent = t;
      b.className = (type === 'ok' ? 'msg-ok' : 'msg-err');
      b.style.display = 'block';
      setTimeout(() => b.style.display = 'none', 4000);
    }
  </script>
</body>
</html>
